<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tier One</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a full-screen 3D call center (white cubicles). The player's monitor is a DOM desktop that fades in when the camera pushes into the screen. Setup, handoff and results are cards over the 3D room. */
:root {
  --ink: #12172B; --ink2: #4A5170; --paper: #F6F7FB; --surface: #FFFFFF; --surface2: #E7EAF4; --line: #CDD2E4;
  --accent: #3446F0; --accent-ink: #FFFFFF; --good: #0B7A55; --warn: #946000; --bad: #C92A33;
  --note: #FFF2B3; --note-ink: #3B3200;
  --os-a: #0c1f57; --os-b: #2a58d8; --os-bar: #12183a; --os-title: #1d2764;
  --display: 'Bricolage Grotesque', 'Arial Narrow', system-ui, sans-serif;
  --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: #5f6772; color: var(--ink); font: 15px/1.5 var(--body);
}
body.no3d { background: repeating-linear-gradient(90deg, #f4f5f2 0 140px, #dfe3ea 140px 146px), #e9edf2; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.05; }
p { margin: 0; }
.lab { display: block; font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); margin-bottom: 8px; }
body::after { content: ''; position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(120% 90% at 50% 45%, rgba(8,12,24,0) 45%, rgba(8,12,24,.5) 100%); }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; touch-action: none; }

/* HUD */
.hud {
  position: fixed; z-index: 5; top: env(safe-area-inset-top, 0px); left: 0; right: 0;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between;
  background: rgba(255,255,255,.86); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  font: 500 13px var(--mono); color: var(--ink2);
}
.hud[hidden] { display: none; }
.hud b { color: var(--ink); font-weight: 600; }
.hud .grp { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.hud .sm { padding: 6px 10px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; font: 600 12px var(--mono); }
.hud .sm:hover { border-color: var(--accent); }
.tierpill { padding: 3px 8px; border-radius: 6px; background: var(--ink); color: #fff; font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.tierpill.t2 { background: var(--bad); }

/* Cards over the room */
.scrim { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, rgba(14,20,50,.12), rgba(14,20,50,.55)); }
.scrim[hidden] { display: none; }
.scrim.clear { background: none; align-items: flex-end; pointer-events: none; }
.scrim.clear > * { pointer-events: auto; }
.card { width: min(680px, 100%); margin: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: grid; gap: 18px; box-shadow: 0 24px 60px -20px rgba(10,16,48,.6); }
.card h1 { font-size: clamp(56px, 14vw, 104px); font-weight: 800; letter-spacing: -.035em; }
.card h2 { font-size: clamp(30px, 6vw, 46px); }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.lede { color: var(--ink2); font-size: 16px; max-width: 60ch; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { border: 1.5px solid var(--line); background: var(--paper); padding: 9px 14px; border-radius: 10px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.hint { color: var(--ink2); font-size: 14px; }
.names { display: grid; gap: 8px; }
.name-row { display: flex; gap: 8px; }
.name-row input { flex: 1; min-width: 0; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); font: inherit; }
.btn { border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.big { font-size: 17px; padding: 14px 22px; justify-self: start; }
.btn.danger { background: var(--bad); }
.btn.good { background: var(--good); }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin: 0; }
.rules dt { font-weight: 600; } .rules dd { margin: 4px 0 0; color: var(--ink2); font-size: 14px; }
.best, .tiny { font: 500 13px var(--mono); color: var(--ink2); }
.pill { justify-self: start; font: 600 12px var(--mono); padding: 4px 8px; border-radius: 6px; border: 1.5px solid var(--c); color: var(--c); }
.c-good { --c: var(--good); } .c-warn { --c: var(--warn); } .c-bad { --c: var(--bad); }
.stars { font-size: 22px; letter-spacing: .12em; color: var(--warn); }
.rows { display: grid; gap: 4px; font: 500 14px var(--mono); }
.rows div { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px dashed var(--line); font-variant-numeric: tabular-nums; }
.rows .tot { border-bottom: 0; font-weight: 600; }
.truth { color: var(--ink2); } .truth b { color: var(--ink); }
.total { font: 800 clamp(64px, 16vw, 104px)/1 var(--display); font-variant-numeric: tabular-nums; }
.total small { font: 500 16px var(--mono); color: var(--ink2); margin-left: 6px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 24px; font: 500 13px var(--mono); color: var(--ink2); }
.stats b { color: var(--ink); }
.list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.list li { display: flex; justify-content: space-between; gap: 12px; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.list .t span { display: block; color: var(--ink2); font-size: 13px; }
.list .n { font: 600 14px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.callout { background: var(--note); color: var(--note-ink); border-radius: 8px; padding: 12px 14px; font-size: 14px; }
.ringbtn { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(52,70,240,.55); } 50% { box-shadow: 0 0 0 14px rgba(52,70,240,0); } }

/* Desktop on the monitor */
#desk {
  position: fixed; z-index: 10; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 64px); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  border: 10px solid #1d2028; border-radius: 16px; overflow: hidden; display: none; opacity: 0; transition: opacity .35s;
  background: radial-gradient(120% 90% at 20% 10%, var(--os-b), var(--os-a)); box-shadow: 0 30px 80px rgba(0,0,0,.55);
  user-select: none;
}
#desk.show { display: block; } #desk.on { opacity: 1; }
#desk .logo { position: absolute; right: 28px; top: 22px; font: 800 28px var(--display); letter-spacing: -.02em; color: rgba(255,255,255,.16); pointer-events: none; text-align: right; }
.icons { position: absolute; left: 10px; top: 10px; display: grid; gap: 6px; width: 84px; z-index: 1; }
.icon { background: transparent; border: 0; color: #fff; display: grid; justify-items: center; gap: 4px; padding: 6px 2px; border-radius: 8px; font: 500 11px/1.15 var(--body); text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.icon:hover { background: rgba(255,255,255,.14); }
.icon i { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; font: 700 14px var(--mono); font-style: normal; color: #fff; background: var(--ic, #3446F0); box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.win { position: absolute; background: var(--surface); border: 1px solid #8f98ba; border-radius: 10px; box-shadow: 0 14px 40px rgba(0,0,0,.4); display: flex; flex-direction: column; overflow: hidden; color: var(--ink); min-width: 0; user-select: text; }
.win.hide { display: none; }
.win.front { box-shadow: 0 18px 48px rgba(0,0,0,.55); border-color: #c4cbe8; }
.tb { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 6px 0 12px; background: var(--os-title); color: #fff; font: 600 13px var(--body); cursor: grab; touch-action: none; flex: none; user-select: none; }
.win:not(.front) .tb { background: #4a5083; }
.tb span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb button { border: 0; background: transparent; color: #fff; width: 28px; height: 24px; border-radius: 6px; font-size: 14px; line-height: 1; }
.tb button:hover { background: rgba(255,255,255,.2); }
.wb { flex: 1; min-height: 0; display: flex; flex-direction: column; font-size: 14px; }
.taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background: var(--os-bar); border-top: 1px solid rgba(255,255,255,.14); display: flex; align-items: center; gap: 6px; padding: 0 8px; z-index: 50; color: #fff; user-select: none; }
.taskbar .start { width: 34px; height: 30px; border: 0; border-radius: 8px; background: linear-gradient(135deg,#6e86ff,#3446F0); font: 800 15px var(--display); color: #fff; }
.taskbar .app { border: 0; background: rgba(255,255,255,.08); color: #fff; padding: 0 12px; height: 30px; border-radius: 8px; font: 500 12px var(--body); border-bottom: 3px solid transparent; white-space: nowrap; }
.taskbar .app.open { background: rgba(255,255,255,.18); border-bottom-color: #8da0ff; }
.taskbar .app[hidden] { display: none; }
.taskbar .apps { display: flex; gap: 6px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tray { display: flex; gap: 12px; align-items: center; font: 500 12px var(--mono); color: #c8d0f5; white-space: nowrap; }

/* Softphone */
.cc { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--paper); }
.avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: hsl(var(--h) 55% 38%); color: #fff; font: 800 17px var(--display); grid-row: span 2; }
.cc h3 { font-size: 19px; } .cc .sub { color: var(--ink2); font-size: 12.5px; }
.cc .tm { font: 600 15px var(--mono); font-variant-numeric: tabular-nums; grid-row: span 2; text-align: right; }
.cc .tm small { display: block; font: 500 10px var(--mono); color: var(--ink2); letter-spacing: .06em; text-transform: uppercase; }
.pat { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.pat .lab { margin: 0; }
.bars { display: flex; gap: 3px; align-items: flex-end; height: 22px; }
.bars i { width: 10px; border-radius: 2px; background: var(--line); display: block; }
.bars i.on { background: var(--c); }
.mood { font: 600 12px var(--mono); color: var(--c); margin-left: auto; text-align: right; }
.m-calm { --c: var(--good); } .m-imp { --c: var(--warn); } .m-hot { --c: var(--bad); } .m-end { --c: var(--bad); }
.log { flex: 1; min-height: 120px; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.msg { max-width: 90%; padding: 8px 11px; border-radius: 12px; line-height: 1.4; }
.msg .tag { display: block; font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; opacity: .7; }
.msg.caller { align-self: flex-start; background: var(--surface2); border-top-left-radius: 3px; }
.msg.tech { align-self: flex-end; background: var(--accent); color: #fff; border-top-right-radius: 3px; }
.msg.sys { align-self: center; max-width: 100%; text-align: center; border: 1px dashed var(--line); color: var(--ink2); font: 500 12px var(--mono); }
.msg.typing { opacity: .6; font-style: italic; }
.inputbar { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); background: var(--paper); align-items: center; }
.inputbar input { flex: 1; min-width: 0; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; font: inherit; background: var(--surface); color: var(--ink); }
.inputbar .btn { padding: 10px 14px; }
.icbtn { width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-size: 15px; flex: none; }
.icbtn[aria-pressed="true"] { background: var(--bad); color: #fff; border-color: var(--bad); animation: pulse 1.2s ease-in-out infinite; }
.sub2 { padding: 0 10px 8px; color: var(--ink2); font: 500 11px var(--mono); background: var(--paper); }

/* Ticket, directory, admin, security */
.pad { padding: 12px 14px; display: grid; gap: 10px; overflow-y: auto; align-content: start; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; }
.kv dt { color: var(--ink2); font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }
.kv dd { margin: 0; }
.notes { background: var(--note); color: var(--note-ink); border-radius: 6px; padding: 10px 12px; font-size: 13px; }
.notes h4 { margin: 0 0 6px; font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.notes ul { margin: 0; padding-left: 16px; display: grid; gap: 4px; }
textarea.free { width: 100%; min-height: 64px; resize: vertical; border: 1.5px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; color: var(--ink); background: var(--surface); }
.tbtns { display: grid; gap: 8px; }
.tbtns .btn { padding: 10px 12px; font-size: 14px; text-align: left; }
.search { display: flex; gap: 6px; }
.search input { flex: 1; min-width: 0; padding: 9px 10px; border: 1.5px solid var(--line); border-radius: 8px; font: inherit; color: var(--ink); background: var(--surface); }
.rec { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; background: var(--paper); }
.rec h4 { margin: 0; font: 700 16px var(--display); }
.rec .btn { padding: 7px 10px; font-size: 13px; justify-self: start; }
.empty { color: var(--ink2); font-size: 13px; }
.acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px; }
.acts button { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.acts button:hover:not(:disabled) { border-color: var(--accent); }
.acts button:disabled { opacity: .5; cursor: not-allowed; }
.acts .danger { color: var(--bad); }
.alog { font: 500 12px var(--mono); display: grid; gap: 3px; color: var(--ink2); }
.tbl { width: 100%; border-collapse: collapse; font: 500 12px var(--mono); }
.tbl th { text-align: left; color: var(--ink2); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; font-size: 10.5px; padding: 4px 6px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr.flag td { background: rgba(201,42,51,.1); }
.tbl .bad { color: var(--bad); font-weight: 600; } .tbl .ok { color: var(--good); }
.scroll-x { overflow-x: auto; }

/* Dark mode for the desktop apps */
#desk[data-os="dark"] { color-scheme: dark; --surface: #171c33; --paper: #1f2644; --ink: #e8ebfa; --ink2: #9aa3c8; --line: #333b63; --surface2: #2a3358; --note: #4a4112; --note-ink: #fbefb0; --good: #34d399; --warn: #f5b93b; --bad: #ff6b72; --accent: #5b6cff; --os-title: #2a3470; background: radial-gradient(120% 90% at 20% 10%, #1b2a66, #060b20); }
#desk[data-os="dark"] .win { border-color: #3a4272; }
#desk[data-os="dark"] .win:not(.front) .tb { background: #232a52; }
#desk[data-os="dark"] .msg.tech { color: #fff; }
#desk[data-os="dark"] .tbl tr.flag td { background: rgba(255,107,114,.14); }
.trayb { border: 1px solid rgba(255,255,255,.25); background: transparent; color: #c8d0f5; border-radius: 6px; padding: 3px 8px; font: 500 11px var(--mono); }
.trayb:hover { background: rgba(255,255,255,.12); }
.avatar.talk { animation: talk .45s ease-in-out infinite alternate; }
@keyframes talk { from { box-shadow: 0 0 0 0 hsl(var(--h) 70% 55% / .55); } to { box-shadow: 0 0 0 9px hsl(var(--h) 70% 55% / 0); } }
.icbtn.cue { border-color: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
.hud .items { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.hud .sm[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
#spk[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); animation: none; }
#desk[data-os="dark"] #spk[aria-pressed="true"] { color: #0c1020; }
#desk[data-os="dark"] .btn.good, #desk[data-os="dark"] .btn.danger { color: #0c1020; }

/* ---- Turn 4: icons, face cam, remote assist, settings, lock screen, dev, tutorial ---- */
.icon i svg { display: block; }
.icons { gap: 2px; max-height: calc(100% - 52px); overflow: hidden; }
.icon { padding: 4px 2px; }
.icon i { width: 34px; height: 34px; }
.taskbar .app { width: 38px; height: 32px; padding: 0; display: grid; place-items: center; }
.taskbar .app svg { display: block; }
.facebox { display: grid; justify-items: center; gap: 4px; padding: 10px 10px 12px; background: var(--paper); text-align: center; }
.faceart { width: 130px; height: 130px; border-radius: 14px; background: linear-gradient(180deg, #cfe0f5, #e9eef8); display: block; }
#desk[data-os="dark"] .faceart { background: linear-gradient(180deg, #2a3358, #1f2644); }
.fmood { font: 700 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
.fname { font: 700 14px var(--display); }
.facebox .eyes { transform-origin: 60px 60px; animation: blink 4.5s infinite; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
.facebox.talk .mouth { transform-origin: 60px 84px; animation: yap .22s ease-in-out infinite alternate; }
@keyframes yap { from { transform: scaleY(1); } to { transform: scaleY(.55); } }
.wave { display: flex; gap: 3px; align-items: center; justify-content: center; height: 26px; padding: 0 12px; background: var(--paper); border-top: 1px solid var(--line); }
.wave i { flex: 1; max-width: 6px; height: 4px; border-radius: 3px; background: var(--line); transition: background .2s; }
.wave.on i { background: var(--accent); animation: wv .5s ease-in-out infinite alternate; animation-delay: var(--d); }
@keyframes wv { from { height: 4px; } to { height: 22px; } }
.ctrlbar { display: flex; gap: 8px; padding: 8px; border-top: 1px solid var(--line); background: var(--paper); align-items: center; }
.ctrlbar .hang { flex: 1; display: flex; gap: 8px; align-items: center; justify-content: center; border: 0; border-radius: 10px; height: 40px; background: var(--bad); color: #fff; font-weight: 700; }
.ctrlbar .hang svg { transform: rotate(135deg); }
.ctrlbar .hang:hover { filter: brightness(1.1); }
#desk[data-os="dark"] .ctrlbar .hang { color: #0c1020; }
.icbtn { display: grid; place-items: center; }
.lock { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; background: linear-gradient(180deg, #14224f, #3b2a6b 60%, #c2587a); color: #fff; overflow: hidden; cursor: pointer; }
.lock[hidden] { display: none; }
.lock .city { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 38%; opacity: .9; }
.lockbody { position: relative; display: grid; justify-items: center; gap: 8px; text-align: center; padding: 16px; margin-top: -60px; }
.lclock { font: 800 clamp(52px, 11vw, 96px)/1 var(--display); letter-spacing: -.03em; }
.ldate { font: 500 15px var(--body); opacity: .85; margin-bottom: 14px; }
.lavatar { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.4); }
.lname { font: 600 15px var(--body); margin-bottom: 8px; }
.lockbody .btn { justify-self: center; }
.lockbody .hint, .lockbody p { color: rgba(255,255,255,.85); }
.coach { position: absolute; z-index: 55; left: 400px; right: 170px; bottom: 4px; height: 36px; display: flex; align-items: center; background: #fff6c8; color: #3b3200; border: 1.5px solid #e2c84e; border-radius: 8px; padding: 2px 12px; font-size: 12.5px; line-height: 1.25; pointer-events: none; }
.coach[hidden] { display: none; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.setrow.col { flex-direction: column; align-items: stretch; gap: 6px; }
.setrow label { font-weight: 500; }
.setrow select, .setrow input[type=text], .setrow input:not([type]) { padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; min-width: 0; }
.setrow input[type=range] { accent-color: var(--accent); width: 150px; }
.sw { appearance: none; -webkit-appearance: none; width: 42px; height: 24px; border-radius: 12px; background: var(--line); position: relative; cursor: pointer; flex: none; transition: background .15s; margin: 0; }
.sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
.sw:checked { background: var(--accent); }
.sw:checked::after { transform: translateX(18px); }
.rhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rview { display: grid; gap: 8px; }
.rbar { display: flex; align-items: center; gap: 8px; font: 500 12px var(--mono); color: var(--ink2); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px rgba(11,122,85,.25); }
.rscreen { position: relative; height: 150px; border-radius: 8px; overflow: hidden; border: 2px solid #2a2f3a; background: #1a2a52; }
.rwall { position: absolute; inset: 0; background: radial-gradient(120% 90% at 20% 10%, #2a58d8, #0c1f57); }
.rwin { position: absolute; left: 14px; top: 14px; right: 14px; background: #fff; color: #12172B; border-radius: 6px; padding: 10px 12px; font-size: 13px; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.rwin b { display: block; font: 600 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: #4A5170; margin-bottom: 4px; }
.rtask { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: #12183a; }
.rwait { display: flex; align-items: center; gap: 10px; padding: 18px 8px; font-weight: 500; }
.rwait.bad { color: var(--bad); }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.devinfo { margin: 0; padding: 10px; background: #10131c; color: #9fe8b4; border-radius: 8px; font: 500 12px/1.5 var(--mono); white-space: pre-wrap; }
.acts button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
kbd { display: inline-block; padding: 1px 7px; border: 1.5px solid var(--line); border-bottom-width: 3px; border-radius: 6px; background: var(--paper); font: 600 12px var(--mono); color: var(--ink); }
.tutdots { display: flex; gap: 6px; }
.tutdots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: block; }
.tutdots i.on { background: var(--accent); }
.tutlist { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.tutlist li { display: flex; gap: 10px; align-items: baseline; }
.roamhint { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); background: rgba(18,23,43,.88); color: #fff; padding: 9px 16px; border-radius: 12px; font: 500 13px var(--body); text-align: center; max-width: calc(100vw - 32px); pointer-events: none; }
.roamhint[hidden] { display: none; }
.xhair { position: fixed; z-index: 6; left: 50%; top: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%); pointer-events: none; }
.xhair[hidden] { display: none; }
.xhair::before, .xhair::after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.55); }
.xhair::before { left: 6px; top: 0; width: 2px; height: 14px; }
.xhair::after { top: 6px; left: 0; height: 2px; width: 14px; }
.roamhint kbd { background: rgba(255,255,255,.15); color: #fff; border-color: rgba(255,255,255,.35); }
.hud .hold { font: 600 12px var(--mono); padding: 5px 10px; border-radius: 8px; background: var(--note); color: var(--note-ink); }
.dpad { position: fixed; z-index: 6; left: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px); gap: 6px; touch-action: none; }
.dpad[hidden] { display: none; }
.dpad button { border: 0; border-radius: 12px; background: rgba(18,23,43,.7); color: #fff; font-size: 20px; touch-action: none; }
.dpad .f { grid-column: 2; } .dpad .l { grid-row: 2; grid-column: 1; } .dpad .b { grid-row: 2; grid-column: 2; } .dpad .r { grid-row: 2; grid-column: 3; }
.dpad2 { position: fixed; z-index: 6; right: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; gap: 8px; }
.dpad2[hidden] { display: none; }
.dpad2 button { border: 0; border-radius: 12px; background: rgba(18,23,43,.7); color: #fff; padding: 14px 16px; font: 600 14px var(--body); }
.hud .sm svg { vertical-align: -3px; }

.toast { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font: 500 13px var(--mono); max-width: calc(100vw - 32px); text-align: center; }
.toast[hidden] { display: none; }

@media (max-width: 820px) {
  .icons { display: none; }
  #desk { border-width: 6px; border-radius: 12px; top: calc(env(safe-area-inset-top, 0px) + 92px); }
  .win { left: 0 !important; top: 0 !important; width: 100% !important; height: calc(100% - 44px) !important; border-radius: 0; border: 0; }
  .win:not(.front) { display: none; }
  .tb { cursor: default; }
  .desk-logo, #tsig { display: none; }
  .coach { left: 8px; right: 8px; bottom: 50px; height: auto; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  function lookDir() {

  function setTargets() {

    else if (cam.mode === 'roam') { const cp = Math.cos(cam.rpitch); cam.tpos = [cam.rx, cam.ry, cam.rz]; cam.tlook = [cam.rx + Math.sin(cam.ryaw) * cp, cam.ry + Math.sin(cam.rpitch), cam.rz - Math.cos(cam.ryaw) * cp]; }
    else { const d = lookDir(); cam.tpos = LOOK_P; cam.tlook = [LOOK_P[0] + d[0] * 4, LOOK_P[1] + d[1] * 4, LOOK_P[2] + d[2] * 4]; }

  Sfx.play('send'); my.sent++; say('tech', text); my.busy = true; my.idle = 0; my.log.push({ w: 'typing' }); Desk.renderLog(my); Desk.setBusy(true);
  let r;

  if (cur !== my || my.over) return;
  my.log = my.log.filter(x => x.w !== 'typing'); my.busy = false; Desk.setBusy(false);
  applyReply(r);
}

function applyReply(r) {
  const sc = cur.sc;
  if (r.glitch) { say('sys', 'The line crackled. Say that again.'); refresh(); return; }
  if (r.switched) toast('Claude is not available here, so callers are using a simpler offline script.');
  say('caller', r.say); Desk.say(r.say, sc.hue, sc.vp); if (!Desk.voiceOn()) Sfx.play('recv');
  cur.p = clamp(cur.p + r.d, 0, 100); if (DEV.god) cur.p = 100;
  if (cur.p < 20 && !cur.warned) { cur.warned = true; Sfx.play('error'); }
  (r.clues || []).forEach(i => { const q = sc.qs[i]; if (!q) return; if (q.c && cur.notes.indexOf(q.c) < 0) { cur.notes.push(q.c); Sfx.play('ding'); } if (q.k) cur.diag = true; });

  if (r.hangup) { say('sys', 'Click. The caller hung up.'); refresh(); return finish(sc.scam ? 'repelled' : 'hungup'); }
  if (cur.p <= 0) { cur.p = 0; say('sys', 'Click. The caller hung up.'); refresh(); return finish('hungup'); }
  refresh();
}

/* ---------- Tools on the desktop ---------- */

  Desk.renderDir(res.slice(0, 4), q, cur);

  const sc = cur.sc;
  if (sc.scam && q && ql.includes(first(sc.who).toLowerCase())) {
    const n = res.some(r => r.n === sc.who) ? '' : 'No employee named ' + sc.who + ' in the directory.';
    const out = res.find(r => /out of office/i.test(r.s));
    if (n && cur.notes.indexOf(n) < 0) { cur.notes.push(n); cur.diag = true; }
    if (out) { const m = 'A similar name, ' + out.n + ', is out of office until Nov 17.'; if (cur.notes.indexOf(m) < 0) { cur.notes.push(m); cur.diag = true; } }

}

function act(id) {

/* ---------- Remote Assist ---------- */
function connect(code) {
  if (!cur || cur.over || cur.paused || cur.rstate === 'connecting') return;
  const d = String(code || '').replace(/\D/g, ''), real = cur.rcode.replace(/\s/g, ''), sc = cur.sc;
  Sfx.play('click');
  if (d.length !== 9) { toast('Remote IDs are 9 digits.'); Sfx.play('error'); return; }
  if (d !== real) { toast('No computer with that ID is online.'); Sfx.play('error'); return; }
  const my = cur; my.rstate = 'connecting'; Desk.renderRemote(my);
  setTimeout(() => {
    if (cur !== my || my.over) return;
    if (sc.scam) { my.rstate = 'declined'; say('sys', 'The caller declined the remote connection.'); Desk.renderRemote(my); refresh(); Sfx.play('buzz'); return; }
    my.rstate = 'connected'; Sfx.play('chime'); say('sys', 'Remote Assist: connected to ' + sc.who + '’s computer.');
    const n = 'Remote view: ' + (sc.rview || 'nothing unusual on screen.');
    if (sc.rview && my.notes.indexOf(n) < 0) { my.notes.push(n); if (sc.remoteActs.length) my.diag = true; Sfx.play('ding'); }
    Desk.renderRemote(my); refresh();
  }, 1400);
}
function remoteAct(i) {
  if (!cur || cur.over || cur.paused || cur.rstate !== 'connected') return;
  const sc = cur.sc, a = sc.acts[sc.remoteActs[i]]; if (!a || cur.rdone[i]) return;
  cur.rdone[i] = 1; cur.ralog.push(fmtT(cur.sec) + '  ' + a.t); Sfx.play('click'); say('sys', '[REMOTE] ' + a.t);
  say('caller', a.r); Desk.say(a.r, sc.hue, sc.vp); if (!Desk.voiceOn()) Sfx.play('recv');
  if (a.kind === 'breach') { Desk.renderRemote(cur); Desk.renderLog(cur); return finish('breach'); }

  else { cur.p = clamp(cur.p - (a.cost || 8), 0, 100); Sfx.play('error'); }

}
function disconnect() { if (!cur || cur.over) return; cur.rstate = 'idle'; say('sys', 'Remote session ended.'); Desk.renderRemote(cur); refresh(); }
function retryRemote() { if (!cur) return; cur.rstate = 'idle'; Desk.renderRemote(cur); }

function devAct(a, v) {

  switch (a) {

    case 'noclip': case 'fly': DEV[a] = !DEV[a]; if (Office.dev) Office.dev[a] = DEV[a]; break;
    case 'speed': DEV.speed = !DEV.speed; if (Office.dev) Office.dev.speed = DEV.speed ? 3 : 1; break;
    case 'force': DEV.force = v || ''; toast(DEV.force ? 'Next call: ' + DEV.force : 'Scenarios are random again.'); break;
    case 'patience': if (live) { cur.p = clamp(+v || 0, 0, 100); Desk.renderMeter(cur); } break;
    case 'solve': if (live) { cur.diag = true; finish(cur.sc.scam ? 'repelled' : 'solved'); } break;

    case 'tp-desk': case 'tp-boss': case 'tp-door': if (Office.ok) { if (!lookOn) leaveDesk(); Office.roamTo(a.slice(3)); } break;
  }
}

/* ---------- Scoring ---------- */
function finish(kind) {
  if (!cur || cur.over) return;
  cur.over = true; stopTimers(); Desk.stopMic(); Desk.ttsStop(); const sc = cur.sc, T2 = cur.tier === 2, rows = [];
  Sfx.play({ solved: 'chime', repelled: 'chime', escalated: 'transfer', hungup: 'hang', dropped: 'hang', breach: 'alarm' }[kind] || 'buzz');
  Sfx.ringStop(); Desk.coach(''); menuOpen = false; Office.ok && Office.release(); if (lookOn) { lookOn = false; nearD = false; Desk.lock(false); }

    rows.push(cur.diag ? ['Found a key clue', 25] : ['No key clue found', 0]); if (sc.scam) rows.push(['Scam stopped', 10]);
  } else if (kind === 'repelled') {
    rows.push(['Refused to bypass verification', 30]); rows.push(cur.done.report ? ['Reported to Security', 25] : ['Did not report it', 0]); rows.push(cur.diag ? ['Found a key clue', 25] : ['No key clue found', 0]);
  } else if (kind === 'escalated') rows.push(['Handed off to Tier 2', 15]);
  else if (kind === 'hungup') rows.push(['Caller hung up', 0]);
  else if (kind === 'dropped') rows.push(['Hung up before it was fixed', -5]);
  else if (kind === 'breach') rows.push(['Security incident', -25]);
  else if (kind === 'falseclose') rows.push(['Closed the ticket without a fix', -10]);
  else if (kind === 'missed') rows.push(['Closed a scam call as routine', -10]);
  else if (kind === 'falsealarm') rows.push(['False alarm sent to Security', -15]);
  if (T2 && sc.scam && (kind === 'solved' || kind === 'repelled')) rows.push(['Told you so (Tier 2 bonus)', 15]);
  if (T2 && kind === 'breach') rows.push(['Too smart for your own good', -15]);
  const pts = rows.reduce((a, x) => a + x[1], 0);
  const stars = kind === 'breach' ? 0 : (kind === 'solved' || kind === 'repelled') ? starsFor(pts) : kind === 'escalated' ? 2 : 1;
  const owner = run.mode === 'party' ? (T2 ? t2() : t1()) : 0;
  run.scores[owner] += pts;
  run.results.push({ sc, kind, pts, stars, tech: run.names[owner] + (T2 ? ' (Tier 2)' : '') });
  Desk.show(false); Office.mode('seat'); Office.screen('idle'); lookOn = false; nearD = false; hud();
  const meta = { solved: [sc.scam ? 'Scam stopped' : 'Ticket resolved', 'Solved', 'good'], repelled: ['Caller turned away', 'Repelled', 'good'], escalated: ['Handed to Tier 2', 'Escalated', 'warn'], hungup: ['Caller hung up', 'Hang-up', 'bad'], dropped: ['Call dropped', 'Dropped', 'bad'], breach: ['Security incident', 'Incident', 'bad'], falseclose: ['Closed too early', 'Not fixed', 'bad'], missed: ['Scam missed', 'Missed', 'bad'], falsealarm: ['False alarm', 'Wrong call', 'bad'] }[kind];
  const extra = kind === 'breach' ? (sc.scam ? ' The caller got in, and the access went to a thief.' : ' Security flagged the change. Policy violations count as incidents.') : '';
  const last = run.i + 1 >= run.length;
  setMenu('<div class="card" style="width:min(560px,100%)"><span class="pill c-' + meta[2] + '">' + meta[1] + '</span><h2>' + meta[0] + '</h2><div class="stars" aria-label="' + stars + ' out of 5 stars">' + starStr(stars) + '</div>' +
    '<div class="rows">' + rows.map(x => '<div><span>' + esc(x[0]) + '</span><span>' + (x[1] > 0 ? '+' : '') + x[1] + '</span></div>').join('') + '<div class="tot"><span>Call total' + (run.mode === 'party' ? ' for ' + esc(run.names[owner]) : '') + '</span><span>' + pts + '</span></div></div>' +
    '<p class="truth"><b>What was really going on.</b> ' + esc(sc.truth + extra) + '</p><button class="btn big" data-do="next" id="nextbtn">' + (last ? 'Finish shift' : 'Next call') + '</button></div>');
  const b = $('nextbtn'); if (b) b.focus({ preventScroll: true });
}

/* ---------- Report ---------- */
function report2() {

  const csat = (res.reduce((a, x) => a + x.stars, 0) / res.length).toFixed(1);

  }

    '<div><span class="lab">Calls</span><ul class="list">' + res.map(x => '<li><div class="t">' + esc(x.sc.who) + '<span>' + esc(x.sc.ticket) + ' · ' + outcome[x.kind] + (party ? ' · ' + esc(x.tech) : '') + '</span></div><div class="n">' + x.pts + '</div></li>').join('') + '</ul></div>' +
